name: dast
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Start ephemeral Stack
        run: docker compose -f docker-compose.ci.yml up -d --build
      - name: Wait for app to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/actuator/health/liveness; then
              echo "App is healthy after $i attempts"
              exit 0
            fi
            echo "Attempt $i/30 failed"
            sleep 5
          done
          echo "ERROR: App never became healthy"
          docker compose -f docker-compose.ci.yml logs trainer
          exit 1
      - name: Get Docker host IP
        run: echo "DOCKER_HOST_IP=$(docker network inspect bridge --format='{{range .IPAM.Config}}{{.Gateway}}{{end}}')" >> $GITHUB_ENV
      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@75ee1686750ab1511a73b26b77a2aedd295053ed # v0.12.0
        with:
          target: 'http://${{ env.DOCKER_HOST_IP }}:8080'
          fail_action: false
          cmd_options: >-
            -config globalexcludeurl.url_list.url(0).regex="^.*/api/sync.*$"
            -config globalexcludeurl.url_list.url(0).enabled=true
            -config globalexcludeurl.url_list.url(1).regex="^.*/mcp.*$"
            -config globalexcludeurl.url_list.url(1).enabled=true
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down
